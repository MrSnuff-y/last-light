function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=dpr<1.75?Math.min(blur,8):blur}function draw(){ctx.fillStyle='#080d1c';ctx.fillRect(0,0,W,H);ctx.save();if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));ctx.strokeStyle='#1d375144';ctx.lineWidth=1;let off=(clock*12)%45;for(let x=-45+off;x<W+45;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-45+off;y<H+45;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let s of stars){ctx.globalAlpha=s.a*(.8+.2*Math.sin(clock+s.x));ctx.fillStyle='#9bdeff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;if(mode!=='menu'){for(let c of crates){glow('#7cffaf',20);ctx.strokeStyle='#b0ffd0';ctx.lineWidth=3;ctx.strokeRect(c.x-12,c.y-12,24,24);ctx.fillStyle='#4fdd9c';ctx.fillRect(c.x-3,c.y-9,6,18);ctx.fillRect(c.x-9,c.y-3,18,6)}for(let g of gems){glow('#5aeaff',14);ctx.fillStyle='#56e6ff';ctx.save();ctx.translate(g.x,g.y);ctx.rotate(clock*2);ctx.fillRect(-g.r,-g.r,g.r*2,g.r*2);ctx.restore()}for(let s of shots){glow('#8afcff',16);ctx.fillStyle='#b3faff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}for(let e of enemies){glow(e.color,15);ctx.fillStyle=e.hit>0?'#ffffff':e.color;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.phase*.2);ctx.beginPath();let n=e.r>18?6:4;for(let i=0;i<n;i++){let a=i*Math.PI*2/n;ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r)}ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;ctx.fillStyle='#101429';ctx.beginPath();ctx.arc(e.x,e.y,e.r*.38,0,7);ctx.fill()}for(let p of particles){ctx.globalAlpha=Math.max(0,p.t/p.life);glow(p.color,8);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;if(player){if(player.orbit)for(let i=0;i<player.orbit;i++){let a=clock*2.5+i*Math.PI*2/player.orbit;glow('#9fffe4',20);ctx.fillStyle='#aaffea';ctx.beginPath();ctx.arc(player.x+Math.cos(a)*55,player.y+Math.sin(a)*55,7,0,7);ctx.fill()}ctx.globalAlpha=player.inv>0?.5+.5*Math.sin(clock*35):1;glow('#41eaff',30);ctx.fillStyle='#3fd6ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,7);ctx.fill();glow('#e5ffff',15);ctx.fillStyle='#eaffff';ctx.beginPath();ctx.arc(player.x,player.y,player.r*.62,0,7);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#55dfff66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,player.r+12+Math.sin(clock*4)*3,0,7);ctx.stroke()}}ctx.shadowBlur=0;ctx.restore();if(joy&&mode==='play'){let dx=joy.x-joy.sx,dy=joy.y-joy.sy,l=Math.hypot(dx,dy),m=Math.min(l,55);ctx.strokeStyle='#79dfff55';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.sx,joy.sy,55,0,7);ctx.stroke();ctx.fillStyle='#6ddfff77';ctx.beginPath();ctx.arc(joy.sx+(l?dx/l*m:0),joy.sy+(l?dy/l*m:0),22,0,7);ctx.fill()}let vignette=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.1,W/2,H/2,Math.max(W,H)*.75);vignette.addColorStop(0,'#00000000');vignette.addColorStop(1,'#000b20a8');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H)}function loop(ts){let dt=Math.min(.035,(ts-last)/1000||.016);last=ts;if(mode==='play')update(dt);if(mode==='menu')clock+=dt;draw();requestAnimationFrame(loop)}menu();requestAnimationFrame(loop);document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});})();
